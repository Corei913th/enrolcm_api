name: 🚛 CD - Staging

on:
  workflow_run:
    workflows: [ "🏗️ CI - Validation" ]
    types:
      - completed
    branches:
      - dev

jobs:
  check-ci:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 🔍 CI Validation
        run: echo "CI validated. Proceeding to deploy..."

  deploy:
    name: 🚀 Deploy to DOCKER HUB
    needs: [ check-ci ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/enrolcm-app:develop,${{
            secrets.DOCKERHUB_USERNAME }}/enrolcm-app:${{ github.sha }}
