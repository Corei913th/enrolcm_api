name: 🏗️ CI - Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  security:
    name: 🛡️ Security Audit & SAST
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Composer Audit
        run: composer audit --abandoned=ignore
      - name: Larastan SAST
        run: ./vendor/bin/phpstan analyse --error-format=github --memory-limit=1G

  secret-scan:
    name: 🛡️ Secret Scanning
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac:
    name: 🛡️ IaC & Docker Scan
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  lint:
    name: 🧹 Lint & Style
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: PHP Pint
        run: ./vendor/bin/pint --test

  tests:
    name: 🧪 Feature & Unit Tests
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: enrolcm_db_test
      DB_USERNAME: user
      DB_PASSWORD: password
      TESSERACT_PATH: /usr/bin/tesseract
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      BROWSERSHOT_BINARY: /usr/bin/chromium
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: enrolcm_db_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, bcmath
          coverage: none
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Generate Key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 775 storage bootstrap/cache
      - name: Build Frontend Assets
        run: npm install && npm run build
      - name: Install System Deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng chromium chromium-driver libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2
      - name: Run Migrations
        run: php artisan migrate --force
      - name: Seed Database
        run: php artisan db:seed --force
      - name: Run Tests
        run: php artisan test tests/Feature/Auth tests/Feature/Registration

  sonarqube:
    name: 🛡️ SonarQube Scan
    continue-on-error: true
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
